name: Qurtiz scheduled jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke:
    name: ${{ matrix.endpoint }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        endpoint: [publish, maintenance]
    concurrency:
      group: qurtiz-scheduler-${{ matrix.endpoint }}
      cancel-in-progress: false
    env:
      CRON_SECRET: ${{ secrets.QURTIZ_CRON_SECRET }}
    steps:
      - name: Require scheduler credential
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "QURTIZ_CRON_SECRET is missing. Set it to the same value as Vercel Production CRON_SECRET."
            exit 1
          fi
      - name: Invoke authenticated Qurtiz job
        run: |
          response_file="$RUNNER_TEMP/qurtiz-${{ matrix.endpoint }}-response.json"
          if ! curl --fail-with-body --silent --show-error --retry 0 --max-time 295 \
            --output "$response_file" \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://qurtiz-ai.vercel.app/api/cron/${{ matrix.endpoint }}"; then
            echo "Qurtiz ${{ matrix.endpoint }} endpoint failed. Safe route response:"
            head -c 1200 "$response_file" || true
            exit 1
          fi
          echo "Qurtiz ${{ matrix.endpoint }} endpoint completed:"
          head -c 1200 "$response_file"
